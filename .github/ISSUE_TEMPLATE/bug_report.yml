name: Bug report
description: Report a reproducible app or provider problem.
body:
  - type: markdown
    attributes:
      value: "Do not attach real sign-in files, keys, tokens, or personal account screenshots. Use demo data. For security issues, see SECURITY.md."
  - type: input
    id: version
    attributes:
      label: App and macOS versions
      placeholder: "Sub Tracker 0.1.0, macOS 15.7, Apple silicon"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Notch, Menu bar, Settings, Codex, Claude, Z.ai, Build or install]
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected behavior
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual behavior
    validations:
      required: true
